<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Threaded | Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            background: #fdf5f7;
        }

        .admin-page {
            padding: 50px 6%;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .admin-title {
            font-family: "Caveat", cursive;
            font-size: 60px;
        }

        .admin-title span {
            color: #d8799b;
        }

        .back-home {
            padding: 12px 20px;
            border-radius: 25px;
            background: #dc7b9d;
            color: white;
        }

        .dashboard-cards {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
            margin-bottom: 40px;
        }

        .dashboard-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #efdde4;
        }

        .dashboard-card p {
            color: #81727a;
            font-size: 13px;
        }

        .dashboard-card h2 {
            font-family: "Poppins", sans-serif;
            font-size: 32px;
            margin-top: 5px;
        }

        .admin-table {
            background: white;
            border-radius: 25px;
            padding: 25px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #f1e1e6;
            font-size: 13px;
        }

        th {
            color: #d47799;
        }

        select {
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #e8d4dc;
        }

        .refund-btn {
            background: #f0d5de;
            color: #8d4661;
            padding: 8px 12px;
            border-radius: 15px;
        }

        .customer-btn {
            background: #e9def3;
            padding: 8px 12px;
            border-radius: 15px;
        }

        @media(max-width: 800px) {

            .dashboard-cards {
                grid-template-columns: 1fr 1fr;
            }

            .admin-header {
                display: block;
            }

            .back-home {
                display: inline-block;
                margin-top: 15px;
            }

        }

    </style>

</head>


<body>

<div class="admin-page">

    <div class="admin-header">

        <div>

            <p class="section-small">
                THREADED ADMIN
            </p>

            <h1 class="admin-title">
                little business,
                <span>big dreams ♡</span>
            </h1>

        </div>

        <a
            href="index.html"
            class="back-home"
        >
            ← Customer Website
        </a>

    </div>


    <!-- DASHBOARD CARDS -->

    <div class="dashboard-cards">

        <div class="dashboard-card">

            <p>Total Orders</p>

            <h2 id="totalOrders">
                0
            </h2>

        </div>


        <div class="dashboard-card">

            <p>Processing</p>

            <h2 id="processingOrders">
                0
            </h2>

        </div>


        <div class="dashboard-card">

            <p>Delivered</p>

            <h2 id="deliveredOrders">
                0
            </h2>

        </div>


        <div class="dashboard-card">

            <p>Refunded</p>

            <h2 id="refundedOrders">
                0
            </h2>

        </div>

    </div>


    <!-- ORDERS -->

    <div class="admin-table">

        <h2>
            Received Orders ♡
        </h2>

        <br>

        <table>

            <thead>

                <tr>

                    <th>Order</th>

                    <th>Customer</th>

                    <th>Bracelet</th>

                    <th>Amount</th>

                    <th>Payment</th>

                    <th>Status</th>

                    <th>Due Date</th>

                    <th>Customer Details</th>

                    <th>Refund</th>

                </tr>

            </thead>


            <tbody id="adminOrders">

            </tbody>

        </table>

    </div>

</div>


<script src="admin.js"></script>

</body>

</html>
